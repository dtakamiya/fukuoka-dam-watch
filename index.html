<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fukuoka-dam-watch — 福岡市関連9ダム貯水状況</title>
  <meta name="description" content="福岡市関連9ダム（南畑・五ケ山・脊振・曲渕・江川・久原・長谷・猪野・瑞梅寺）の貯水量・貯水率を1時間粒度で可視化する静的サイト。">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <h1>福岡市関連9ダム 貯水状況</h1>
    <p class="tagline">貯水量・貯水率を1時間粒度で可視化</p>
  </header>

  <main class="site-main">
    <section class="status-banner" id="data-status" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="data-status-text">データを読み込み中…</span>
    </section>

    <p class="sample-badge" id="sample-badge" hidden>サンプルデータ表示中</p>
    <p class="bootstrap-note" id="bootstrap-note" hidden></p>

    <section class="summary-section" aria-labelledby="summary-heading">
      <h2 id="summary-heading" class="visually-hidden">9ダム合計</h2>
      <div class="summary-card" id="summary-card">
        <p class="summary-label">9ダム合計 貯水率</p>
        <p class="summary-rate" id="summary-rate">—</p>
        <p class="summary-detail" id="summary-detail">貯水量 — ／ 総容量 —</p>
        <p class="summary-delta" id="summary-delta"></p>
      </div>
    </section>

    <section class="dam-list-section" aria-labelledby="dam-list-heading">
      <h2 id="dam-list-heading">ダム別（9ダム）</h2>
      <ul class="dam-list" id="dam-list">
        <!-- assets/app.js が描画 -->
      </ul>
      <p class="legend" aria-hidden="true">
        <span class="legend-item"><span class="swatch is-normal"></span>平常 (≥60%)</span>
        <span class="legend-item"><span class="swatch is-caution"></span>注意 (30–60%)</span>
        <span class="legend-item"><span class="swatch is-drought"></span>渇水 (&lt;30%)</span>
      </p>
    </section>

    <section class="chart-section" aria-labelledby="chart-heading">
      <h2 id="chart-heading">推移グラフ</h2>

      <div class="chart-controls">
        <div class="range-toggle" id="range-toggle" role="group" aria-label="表示期間">
          <button type="button" data-range="24h" class="is-active">24時間</button>
          <button type="button" data-range="7d">7日</button>
          <button type="button" data-range="30d">30日</button>
        </div>
        <div class="metric-toggle" id="metric-toggle" role="group" aria-label="表示指標">
          <button type="button" data-metric="rate" class="is-active">貯水率 (%)</button>
          <button type="button" data-metric="storage">貯水量 (千m³)</button>
        </div>
      </div>

      <div class="chart-box">
        <canvas id="trend-chart" aria-label="ダム貯水の推移グラフ" role="img"></canvas>
      </div>

      <fieldset class="series-toggle" id="series-toggle">
        <legend>系列の表示（既定は合計のみ）</legend>
        <!-- assets/app.js が描画 -->
      </fieldset>

      <p class="chart-note" id="chart-note" hidden></p>
    </section>

    <p class="updated-line" id="updated-line"></p>
  </main>

  <footer class="site-footer">
    <p>
      出典: 福岡市オープンデータ / BODIK
      （<a href="https://data.bodik.jp/dataset/d54fb22e-5b64-485c-8816-69f27ed1aaf1" rel="noopener noreferrer" target="_blank">福岡市関連9ダム貯水量データセット</a>、
      <a href="https://www.city.fukuoka.lg.jp/mizu/mizukanri/machi/002.html" rel="noopener noreferrer" target="_blank">福岡市「きょうのダム状況」</a>）
    </p>
    <p>ダムデータは福岡市オープンデータの利用条件に従います。コードは MIT ライセンス。</p>
  </footer>

  <!-- Chart.js（CDN・1本のみ / バンドラなし） -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
